<title id="t">Model time per call, stock against the Playground Serve fast path, per model family</title>
<desc id="d">MolmoAct2 on DROID, RTX 4090: stock 532.0 ms, fast 104.8 ms; Xiaomi-Robotics-1 on RoboCasa365, RTX 4090: stock 267.9 ms, fast 65.5 ms; ABC-VLA on YAM (ABC sim), RTX 4090: stock 84.0 ms, fast 28.8 ms; Flex-π on LIBERO, A40: stock 318.5 ms, fast 131.9 ms; π0.5 (openpi) on LIBERO, RTX 4090: stock 75–79 ms, fast 31–34 ms; GR00T N1.7 on LIBERO, RTX 4090: stock 118.4 ms, fast 68.5 ms; Cosmos 3 Edge on DROID, RTX 5090: stock 514.0 ms, fast 439.5 ms</desc>
