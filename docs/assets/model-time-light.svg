<text x="28" y="42" font-size="18" font-weight="600" fill="#1f2328">Time per model call: stock against the fast path</text>
<text x="28" y="66" font-size="13" fill="#59636e">Server infer_ms, median, on each model's default GPU. Same weights, precision, steps and inputs;</text>
<text x="28" y="84" font-size="13" fill="#59636e">the fast path must reproduce the stock actions at every start, or the worker serves stock.</text>
